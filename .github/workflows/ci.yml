name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Source contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run source contract tests
        run: python tools/source_contract_test.py
      - name: Validate project rules, skills, and adapters
        run: python tools/validate_project_context.py

  avr-build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - nanoatmega328
          - megaatmega2560
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}