; PlatformIO project configuration for metisa firmware by SaGaLabs
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328
src_dir = Arduino_Pedelec_Controller

[env]
framework = arduino
build_flags =
    -I Arduino_Pedelec_Controller
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

; Target: FC 1.x (Arduino Nano / ATmega328P @ 16 MHz)
[env:nanoatmega328]
platform = atmelavr@5.1.0
board = nanoatmega328
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    cbm80amiga/ST7789 AVR@1.2.1

; Target: FC 2.x (Arduino Mega 2560 / ATmega2560 @ 16 MHz)
[env:megaatmega2560]
platform = atmelavr@5.1.0
board = megaatmega2560
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    cbm80amiga/ST7789 AVR@1.2.1

; Target: STM32F401CC Black Pill (84 MHz Cortex-M4F)
[env:stm32_blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
monitor_speed = 115200

; Target: Raspberry Pi Pico (RP2040 Dual ARM Cortex-M0+ @ 133 MHz)
[env:pico]
platform = raspberrypi
board = pico
monitor_speed = 115200

; Experimental targets: the current firmware still contains AVR-specific code
; and needs a hardware abstraction port before these environments can build.
